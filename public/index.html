<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00d4aa" />
    <meta name="description" content="GesTrack Business : gérez le stock de votre boutique et de votre magasin, vos factures, vos dettes clients, vos fournisseurs et votre catalogue en ligne." />
    <!-- Aperçu par défaut des liens partagés (WhatsApp, Facebook…). Les catalogues ont leur
         propre aperçu (nom de la boutique, photo) via api/apercu.js — voir vercel.json. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GesTrack Business" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="GesTrack Business — Stock, factures et dettes de votre commerce" />
    <meta property="og:description" content="Gérez votre stock, vos factures, vos dettes clients et votre catalogue en ligne, depuis votre téléphone." />
    <meta property="og:image" content="https://www.gestrack.business/logo512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="application-name" content="GesTrack" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GesTrack" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <!-- Apple Touch Icon (écran d'accueil iPhone/iPad) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>GesTrack Business</title>
    <!-- Connexions préparées à l'avance : serveur et photos des produits -->
    <link rel="preconnect" href="%REACT_APP_API_URL%" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!-- Écran d'attente affiché dès la réception de cette page, sans attendre le JavaScript
         (voir aussi components/common/EcranChargement.jsx, qui reprend ces styles) -->
    <style>
      body { margin: 0; background: #0f2027; }
      .ecran-demarrage {
        position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column;
        align-items: center; justify-content: center; padding: 24px; text-align: center;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #fff;
        font: 15px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .ed-groupe { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .ed-anneau {
        position: relative; width: 108px; height: 108px; margin-bottom: 14px;
        display: flex; align-items: center; justify-content: center;
      }
      .ed-anneau::before {
        content: ''; position: absolute; inset: 0; border-radius: 50%;
        background: conic-gradient(rgba(0, 212, 170, 0), #00d4aa 300deg, rgba(0, 212, 170, 0));
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        animation: ed-rotation 1.1s linear infinite;
      }
      .ed-logo {
        width: 84px; height: 84px; border-radius: 50%; background: #fff;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 32px rgba(0, 212, 170, 0.3); animation: ed-pulsation 2s ease-in-out infinite;
      }
      .ed-logo img { width: 64px; height: 64px; object-fit: contain; }
      /* Logo d'une entreprise : déjà recadré à la forme, il remplit tout le rond (ou le carré) */
      .ed-logo--marque { overflow: hidden; }
      .ed-logo--marque img { width: 100%; height: 100%; object-fit: cover; }
      .ed-logo--carre { border-radius: 22%; }
      .ed-titre { font-size: 20px; font-weight: 700; letter-spacing: 0.3px; }
      .ed-barre { width: 150px; height: 3px; margin-top: 22px; border-radius: 3px; overflow: hidden; background: rgba(255, 255, 255, 0.12); }
      .ed-barre i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #00d4aa; animation: ed-glisse 1.3s ease-in-out infinite; }
      /* Variante dans une page de l'application (menu visible) : juste l'anneau, sur fond clair */
      .ecran-demarrage--page { position: static; z-index: auto; height: 100%; min-height: 40vh; background: none; color: #64748b; }
      .ecran-demarrage--page .ed-anneau { transform: scale(0.6); margin: 0; }
      .ecran-demarrage--page .ed-titre, .ecran-demarrage--page .ed-barre { display: none; }
      .ecran-demarrage--page .ed-logo { box-shadow: 0 4px 18px rgba(0, 0, 0, 0.1); }
      @keyframes ed-rotation { to { transform: rotate(360deg); } }
      @keyframes ed-pulsation { 50% { transform: scale(0.95); } }
      @keyframes ed-glisse { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .ed-logo { animation: none; } }
    </style>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser GesTrack.</noscript>
    <div id="root">
      <div class="ecran-demarrage">
        <div class="ed-groupe">
          <div class="ed-anneau"><div class="ed-logo"><img src="/logo192.png" alt="" /></div></div>
          <div class="ed-titre">GesTrack Business</div>
        </div>
        <div class="ed-barre"><i></i></div>
      </div>
    </div>
    <!-- Pages vitrine d'une boutique au forfait payant (/catalogue/<slug>, /<slug>) : nom et
         logo de l'entreprise à la place de GesTrack, gardés sur l'appareil lors d'une ouverture
         précédente (même logique que src/utils/marque.js). Ailleurs : toujours GesTrack. -->
    <script>
      (function () {
        try {
          var s = location.pathname.split('/').filter(Boolean);
          var slug = s[0] === 'catalogue' ? s[1] : (s.length === 1 ? s[0] : null);
          if (!slug) return;
          var m = JSON.parse(localStorage.getItem('gestrack_marque_boutique_' + slug) || 'null');
          if (!m || !m.nom) return;
          var groupe = document.querySelector('.ed-groupe');
          groupe.querySelector('.ed-titre').textContent = m.nom;
          if (m.logo) {
            var logo = groupe.querySelector('.ed-logo');
            logo.className += ' ed-logo--marque' + (m.forme === 'carre' ? ' ed-logo--carre' : '');
            logo.querySelector('img').src = m.logo;
          }
        } catch (e) { /* stockage indisponible : écran GesTrack */ }
      })();
    </script>
  </body>
</html>
